<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A turning cube and ground under an orbit camera, built with Shallot." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>minimal</title>
        <style>body, body * { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-drag: none; cursor: default; }
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #141210; }
            canvas { display: block; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; color: #000; font: 14px/1.5 'Xanh Mono', Consolas, monospace; white-space: pre-line; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp } from "@dylanebert/shallot";
            import { applyMobileUiAppearance } from "../../packages/ascii-shader/input/controls.ts";
            import { mainRenderer } from "../../packages/ascii-shader/plugin.ts";
            import { Welcome } from "./src/welcome";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            const bootstrapOwner = {
                active: true,
                handoff(owner) {
                    if (!this.active) return;
                    this.active = false;
                    if (globalThis.__shallotBootstrap === this) delete globalThis.__shallotBootstrap;
                    if (owner instanceof HTMLElement) bootstrap?.replaceWith(owner);
                    else bootstrap?.remove();
                },
            };
            globalThis.__shallotBootstrap = bootstrapOwner;
            const loading = {
                show() {
                    if (!(bootstrap instanceof HTMLElement)) return;
                    applyMobileUiAppearance(bootstrap);
                    bootstrap.textContent = "Preparing MAIN GPU programs…";
                    return () => {
                        bootstrapOwner.active = false;
                        if (globalThis.__shallotBootstrap === bootstrapOwner) delete globalThis.__shallotBootstrap;
                        bootstrap.remove();
                    };
                },
                update(progress) {
                    if (!bootstrapOwner.active || !(bootstrap instanceof HTMLElement)) return;
                    bootstrap.textContent = `Preparing MAIN GPU programs… ${Math.round(progress * 100)}%`;
                },
                error(error) {
                    if (!bootstrapOwner.active || !(bootstrap instanceof HTMLElement)) return;
                    bootstrapOwner.active = false;
                    if (globalThis.__shallotBootstrap === bootstrapOwner) delete globalThis.__shallotBootstrap;
                    bootstrap.dataset.state = "error";
                    bootstrap.setAttribute("role", "alert");
                    bootstrap.textContent = `MAIN · ERROR\n${error instanceof Error ? error.message : String(error)}`;
                },
            };
            await runApp({
                plugins: [mainRenderer({ ascii: true }), Welcome],
                loading,
            });
        </script>
    </body>
</html>
